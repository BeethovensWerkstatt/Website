<div class="version-info">
  <script>
    fetch("{{ '/meta-version.json' | relative_url }}")
      .then(response => response.json())
      .then(data => {
        const versionInfo = document.querySelector('.version-info');
        versionInfo.setAttribute('title', `Version: ${new Date(data.date).toLocaleString('de-DE')} - ${data.commit.substring(0, 7)} (Branch: ${data.branch})`);
        versionInfo.innerHTML = `&copy; Beethovens-Werkstatt ${new Date(data.date).toLocaleDateString('de-DE')}`;
      })
      .catch(error => {
        console.error('Error fetching version information:', error);
        const versionInfo = document.querySelector('.version-info');
        versionInfo.textContent = 'Error fetching version information.';
      });
  </script>
</div>
<style>
  .version-info {
    display: inline-block;
    color: #bbbbbb;
  }
</style>
